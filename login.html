<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>
    (function () {
      var t = localStorage.getItem('bricko-theme');
      if (t === 'dark' || t === 'light' || t === 'blueprint')
        document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="description" content="Brickø — Ingresá a tu cuenta para seguir tus obras y solicitudes." />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="format-detection" content="telephone=no" />

  <title>Brickø — Iniciar sesión</title>

  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 L22 7 L12 12 L2 7 Z' fill='%23F25C18'/%3E%3Cpath d='M2 7 L2 17 L12 22 L12 12 Z' fill='%231C1C1C'/%3E%3Cpath d='M22 7 L22 17 L12 22 L12 12 Z' fill='%232A2A2A'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="styles/auth.css" />
</head>

<body>

  <div class="bg-grid"></div>

  <!-- ====== NAV ====== -->
  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="brand" aria-label="Brickø, volver al inicio">
        <svg class="cube" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2 L22 7 L12 12 L2 7 Z" fill="#F25C18" />
          <path d="M2 7 L2 17 L12 22 L12 12 Z" fill="#1C1C1C" />
          <path d="M22 7 L22 17 L12 22 L12 12 Z" fill="#2A2A2A" />
        </svg>
        <span style="display: flex; align-items: center;">BRICK<span class="o">Ø</span></span>
      </a>
      <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
        <svg class="icon-plan" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 3h18v18H3z M3 9h18 M3 15h18 M9 3v18 M15 3v18" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ====== LOGIN ====== -->
  <main class="auth-page">
    <div class="auth-modal" id="authLogin">
      <header class="auth-head">
        <span class="id">AUTH / LOGIN — 001</span>
        <a class="auth-close" href="index.html" aria-label="Volver al inicio"></a>
      </header>
      <div class="auth-body">
        <h2 class="auth-title" id="loginTitle">Bienvenido<br>de <em>vuelta.</em></h2>
        <p class="auth-sub">Ingresá a tu cuenta para seguir tus obras y solicitudes.</p>

        <form id="loginForm" novalidate>
          <div class="role-tabs" data-role="cliente" id="loginRoleTabs">
            <span class="role-thumb"></span>
            <button class="role-tab active" type="button" data-role="cliente">
              <svg viewBox="0 0 24 24">
                <path d="M3 21V9l9-6 9 6v12h-6v-7h-6v7H3z" />
              </svg> Cliente
            </button>
            <button class="role-tab" type="button" data-role="profesional">
              <svg viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
              </svg> Profesional
            </button>
          </div>

          <div class="field">
            <label class="field-label" for="loginEmail"><span><span class="ix">/01</span> Email</span><span
                class="req">*</span></label>
            <input type="email" id="loginEmail" class="field-input" placeholder="vos@ejemplo.com"
              autocomplete="email" maxlength="254" />
            <div class="field-msg">Ingresá un email válido</div>
          </div>

          <div class="field">
            <label class="field-label" for="loginPass"><span><span class="ix">/02</span> Contraseña</span><span
                class="req">*</span></label>
            <div class="field-wrap">
              <input type="password" id="loginPass" class="field-input" placeholder="••••••••"
                autocomplete="current-password" minlength="6" maxlength="72" />
              <button type="button" class="field-toggle" data-toggle="loginPass" aria-label="Mostrar contraseña">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <div class="field-msg">Mínimo 6 caracteres</div>
          </div>

          <div class="auth-forgot"><a href="index.html?auth=reset">¿Olvidaste tu contraseña?</a></div>

          <label class="field-check">
            <input type="checkbox" id="loginRemember" />
            <span class="box"></span>
            <span class="lbl">Mantener sesión iniciada en este dispositivo.</span>
          </label>

          <button type="submit" class="auth-submit">Iniciar sesión <span class="arrow"></span></button>

          <div class="auth-divider">o continuar con</div>
          <div class="auth-social">
            <button type="button" class="auth-social-btn" data-social="google">
              <svg viewBox="0 0 24 24">
                <path fill="#4285F4"
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                <path fill="#34A853"
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path fill="#FBBC05"
                  d="M5.84 14.09A6.6 6.6 0 0 1 5.49 12c0-.73.13-1.43.35-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.78.43 3.45 1.18 4.93z" />
                <path fill="#EA4335"
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z" />
              </svg>
              Google
            </button>
            <button type="button" class="auth-social-btn" data-social="apple">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" />
              </svg>
              Apple
            </button>
          </div>
        </form>
      </div>
      <div class="auth-foot">¿Todavía no tenés cuenta?<a href="register.html">Creá una</a></div>
    </div>
  </main>

  <div class="toast-stack" id="toastStack"></div>

  <script src="scripts/supabase.min.js"></script>
  <script src="scripts/00-supabase.js"></script>
  <script src="scripts/01-auth.js"></script>
  <script>
    const $ = (sel, ctx = document) => ctx.querySelector(sel);
    const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

    /* ============ THEME TOGGLE ============ */
    (function initThemeToggle() {
      const THEMES = ['dark', 'light', 'blueprint'];
      $('#themeToggle')?.addEventListener('click', () => {
        const html = document.documentElement;
        html.classList.add('theme-anim');
        const next = THEMES[(THEMES.indexOf(html.getAttribute('data-theme') || 'dark') + 1) % THEMES.length];
        html.setAttribute('data-theme', next);
        localStorage.setItem('bricko-theme', next);
        setTimeout(() => html.classList.remove('theme-anim'), 450);
      });
    })();

    /* ============ TOASTS ============ */
    const stack = $('#toastStack');
    const ICONS = {
      ok: '<path d="M20 6L9 17l-5-5"/>',
      err: '<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>',
      info: '<circle cx="12" cy="12" r="9"/><path d="M12 8v.5M12 11v5"/>'
    };
    function toast(type, title, msg) {
      const el = document.createElement('div');
      el.className = 'toast ' + (type === 'ok' ? 'ok' : type === 'err' ? 'err' : '');
      el.innerHTML = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor">' + (ICONS[type] || ICONS.info) + '</svg>'
        + '<div><div class="t">' + title + '</div><div class="m">' + msg + '</div></div>';
      stack.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
      setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 400); }, 4200);
    }

    /* ============ ROLE TABS ============ */
    const roleState = { login: 'cliente' };
    function setRole(role) {
      roleState.login = role;
      const tabs = $('#loginRoleTabs');
      tabs.setAttribute('data-role', role);
      $$('.role-tab', tabs).forEach(t => t.classList.toggle('active', t.dataset.role === role));
    }
    $$('#loginRoleTabs .role-tab').forEach(t => t.addEventListener('click', () => setRole(t.dataset.role)));

    /* ============ MOSTRAR / OCULTAR CONTRASEÑA ============ */
    $$('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = $('#' + btn.dataset.toggle);
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });

    /* ============ VALIDACIÓN ============ */
    const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
    function fieldFail(input) {
      if (!input) return;
      const field = input.closest('.field');
      if (field) field.classList.add('invalid');
      input.classList.add('bad');
      input.addEventListener('input', () => { if (field) field.classList.remove('invalid'); input.classList.remove('bad'); }, { once: true });
    }
    function clearForm(form) {
      $$('.field', form).forEach(f => f.classList.remove('invalid'));
      $$('.field-input', form).forEach(i => i.classList.remove('bad'));
    }

    // LOGIN submit — usa Auth.login() de Supabase
    $('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearForm(e.target);
      let ok = true;
      const email = $('#loginEmail'), pass = $('#loginPass');
      if (!isEmail(email.value) || email.value.length > 254) { fieldFail(email); ok = false; }
      if (pass.value.length < 6 || pass.value.length > 72) { fieldFail(pass); ok = false; }
      if (!ok) return;

      const btn = e.target.querySelector('.auth-submit');
      btn.classList.add('loading');
      try {
        const remember = $('#loginRemember')?.checked || false;
        await Auth.login({
          email: email.value.trim(),
          password: pass.value,
          remember: remember,
          role: roleState.login
        });
      } catch (err) {
        btn.classList.remove('loading');
        toast('err', 'Error', err.message || 'No se pudo iniciar sesión.');
      }
    });

    // Social (demo)
    $$('[data-social]').forEach(b => b.addEventListener('click', () => {
      toast('info', 'Próximamente', 'El acceso con ' + (b.dataset.social === 'google' ? 'Google' : 'Apple') + ' se activa con el backend.');
    }));
  </script>
</body>

</html>
