<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>
    (function () {
      var t = localStorage.getItem('bricko-theme');
      if (t === 'dark' || t === 'light' || t === 'blueprint')
        document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <title>Brickø — Mis Obras</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 L22 7 L12 12 L2 7 Z' fill='%23F25C18'/%3E%3Cpath d='M2 7 L2 17 L12 22 L12 12 Z' fill='%231C1C1C'/%3E%3Cpath d='M22 7 L22 17 L12 22 L12 12 Z' fill='%232A2A2A'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles/client-dashboard.css" />
</head>

<body>

  <div class="blueprint-grid"></div>
  <div class="bg-spot"></div>

  <!-- NAV -->
  <header class="nav">
    <div class="nav-inner">
      <div style="display:flex;align-items:center;gap:16px">
        <a href="client.html" class="btn-back" aria-label="Volver al panel cliente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
            <path d="M19 12H5M12 5l-7 7 7 7" />
          </svg>
        </a>
        <a href="index.html" class="brand">
          <svg class="cube" viewBox="0 0 24 24" fill="none">
            <path d="M12 2 L22 7 L12 12 L2 7 Z" fill="#F25C18" />
            <path d="M2 7 L2 17 L12 22 L12 12 Z" fill="#1C1C1C" />
            <path d="M22 7 L22 17 L12 22 L12 12 Z" fill="#2A2A2A" />
          </svg>
          <span>BRICK<span class="o-slash">Ø</span></span>
          <span class="pro-tag">CLIENTE</span>
        </a>
      </div>

      <div class="nav-right">
        <div class="user-chip">
          <div class="av" id="userAv">U</div>
          <span id="userNm">Usuario</span>
        </div>
        <button class="btn-logout" id="btnLogout" aria-label="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
            <path d="M16 17l5-5-5-5M21 12H9M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      
      <!-- HERO PANTALLA MIS OBRAS -->
      <section class="mis-obras-hero">
        <div class="mobras-head">
          <div>
            <span class="eyebrow">PANEL DE CONTROL</span>
            <h1>Mis <em>Obras</em></h1>
            <p class="mobras-subtitle">Gestioná tus proyectos de construcción y refacción, revisá detalles completos y evaluá los presupuestos recibidos.</p>
          </div>
          <a href="solicitud-obra.html" class="btn-new-obra">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Nueva Obra
          </a>
        </div>

        <!-- BARRA DE BÚSQUEDA Y FILTROS -->
        <div class="mobras-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="Buscar por ticket, título, dirección o rubro..." />
          </div>

          <div class="filters-row" id="statusFilters">
            <button class="mobras-filter-btn active" data-status="all">Todas (<span id="countAll">0</span>)</button>
            <button class="mobras-filter-btn" data-status="pending">Pendientes (<span id="countPending">0</span>)</button>
            <button class="mobras-filter-btn" data-status="quoted">Cotizando (<span id="countQuoted">0</span>)</button>
            <button class="mobras-filter-btn" data-status="active">En curso (<span id="countActive">0</span>)</button>
            <button class="mobras-filter-btn" data-status="done">Finalizadas (<span id="countDone">0</span>)</button>
          </div>

          <div class="sort-box">
            <label for="sortSelect">Ordenar:</label>
            <select id="sortSelect">
              <option value="recent">Más recientes</option>
              <option value="urgencia">Mayor urgencia</option>
              <option value="quotes">Más presupuestos</option>
            </select>
          </div>
        </div>
      </section>

      <!-- LISTA DE OBRAS -->
      <section class="mobras-list-section">
        <!-- Skeleton loader -->
        <div id="obrasSkeleton" class="obras-skeleton">
          <div class="skel-obra-card"></div>
          <div class="skel-obra-card"></div>
        </div>

        <!-- Contenedor dinámico -->
        <div id="obrasContainer" class="obras-container" style="display:none"></div>

        <!-- Estado vacío -->
        <div id="emptyObras" class="mobras-empty" style="display:none">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="6" y="8" width="36" height="32" rx="2"/>
            <path d="M14 18h20M14 24h14M14 30h10"/>
            <circle cx="33" cy="30" r="3"/>
          </svg>
          <h3>No se encontraron obras</h3>
          <p id="emptyMsg">Todavía no tenés solicitudes de obras o refacciones publicadas.</p>
          <a href="solicitud-obra.html" class="btn-primary" style="margin-top:16px">Publicar mi primera obra</a>
        </div>
      </section>

    </div>
  </main>

  <div class="toast-stack" id="toastStack"></div>

  <script src="scripts/supabase.min.js"></script>
  <script src="scripts/00-supabase.js"></script>
  <script src="scripts/01-auth.js" defer></script>
  <script src="scripts/mis-obras.js"></script>

</body>
</html>
