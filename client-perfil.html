<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      var t = localStorage.getItem('bricko-theme');
      if (t === 'dark' || t === 'light' || t === 'blueprint')
        document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <title>Brickø · Mi perfil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles/client-dashboard.css" />
  <style>
    .perfil-main { max-width: 860px; margin: 0 auto; padding: 40px var(--gutter) 80px; }
    .perfil-head { margin-bottom: 32px; }
    .perfil-head .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; color: var(--orange); text-transform: uppercase; display: inline-flex; align-items: center; gap: 10px; }
    .perfil-head .eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--orange); }
    .perfil-head h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 5vw, 40px); letter-spacing: -.03em; text-transform: uppercase; color: var(--ink); margin: 10px 0 8px; }
    .perfil-head p { color: var(--muted); font-size: 14.5px; line-height: 1.6; max-width: 60ch; }

    .card { background: var(--bg-1); border: 1px solid var(--line-strong); border-radius: 4px; padding: 26px; margin-bottom: 22px; }
    .card-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; color: var(--muted-2); text-transform: uppercase; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }

    .avatar-row { display: flex; align-items: center; gap: 22px; }
    .avatar-preview { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; background: var(--bg-3); border: 1px solid var(--line-strong); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 30px; color: var(--muted); overflow: hidden; flex-shrink: 0; }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }

    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }
    .field > label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 9px; }
    .field .hint { font-size: 11.5px; color: var(--muted-2); margin-top: 6px; }
    input[type="text"], input[type="email"] {
      width: 100%; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 2px;
      padding: 12px 14px; color: var(--ink); font-family: var(--body); font-size: 14px; outline: none;
      transition: all .2s;
    }
    input[type="text"]:focus { border-color: var(--orange); background: var(--bg-1); box-shadow: 0 0 0 3px var(--orange-dim); }
    input[type="text"]:disabled, input[type="email"]:disabled { color: var(--muted); cursor: not-allowed; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }

    .actions { display: flex; gap: 12px; align-items: center; justify-content: flex-end; margin-top: 26px; }
    .btn-save {
      background: var(--orange); color: #000; border: none; border-radius: 2px; padding: 12px 24px;
      font-family: var(--body); font-weight: 700; font-size: 12px; letter-spacing: .05em; text-transform: uppercase;
      cursor: pointer; transition: background .2s;
    }
    .btn-save:hover { background: #FF6B2C; }
    .btn-save:disabled { opacity: .55; cursor: default; }
    input[type="file"] { display: none; }
  </style>
</head>

<body>
  <div class="blueprint-grid"></div>
  <div class="bg-spot"></div>

  <!-- NAV -->
  <header class="nav">
    <div class="nav-inner">
      <a href="client.html" class="brand">
        <svg class="cube" viewBox="0 0 24 24" fill="none">
          <path d="M12 2 L22 7 L12 12 L2 7 Z" fill="#F25C18" />
          <path d="M2 7 L2 17 L12 22 L12 12 Z" fill="#1C1C1C" />
          <path d="M22 7 L22 17 L12 22 L12 12 Z" fill="#2A2A2A" />
        </svg>
        <span>BRICK<span class="o-slash">Ø</span></span>
        <span class="pro-tag">CLIENTE</span>
      </a>
      <div class="nav-right">
        <a href="client.html" class="btn-ghost" style="margin-right:16px">← Volver al panel</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
          <svg class="icon-plan" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v18H3z M3 9h18 M3 15h18 M9 3v18 M15 3v18" /></svg>
        </button>
        <div class="user-chip">
          <div class="av" id="userAv">U</div>
          <span id="userNm">Usuario</span>
        </div>
        <button class="btn-logout" id="btnLogout" aria-label="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
            <path d="M16 17l5-5-5-5M21 12H9M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="perfil-main">
    <div class="perfil-head">
      <span class="eyebrow">Mi cuenta</span>
      <h1>Perfil</h1>
      <p>Estos datos se usan para identificarte y para precargar tus próximas solicitudes.</p>
    </div>

    <div class="card">
      <div class="card-label">Datos personales</div>

      <div class="avatar-row" style="margin-bottom:24px">
        <div class="avatar-preview" id="avatarPreview">U</div>
        <div>
          <label class="btn-save" for="avatarInput" style="cursor:pointer">Subir foto de perfil</label>
          <input type="file" id="avatarInput" accept="image/*" />
          <div class="hint">JPG o PNG.</div>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="fFirstName">Nombre</label>
          <input type="text" id="fFirstName" placeholder="Ej: Ana" />
        </div>
        <div class="field">
          <label for="fLastName">Apellido</label>
          <input type="text" id="fLastName" placeholder="Ej: García" />
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="fEmail">Email</label>
          <input type="email" id="fEmail" disabled />
          <div class="hint">No se puede editar acá.</div>
        </div>
        <div class="field">
          <label for="fPhone">Teléfono</label>
          <input type="text" id="fPhone" placeholder="Ej: 221 555 0101" />
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="fCity">Localidad</label>
          <input type="text" id="fCity" placeholder="Ej: La Plata" />
        </div>
        <div class="field">
          <label for="fProvince">Provincia</label>
          <input type="text" id="fProvince" placeholder="Ej: Buenos Aires" />
        </div>
      </div>

      <div class="field">
        <label for="fAddress">Dirección</label>
        <input type="text" id="fAddress" placeholder="Calle, número, piso/depto" />
      </div>
    </div>

    <div class="actions">
      <a href="client.html" class="btn-ghost">Cancelar</a>
      <button class="btn-save" id="btnSave">Guardar cambios</button>
    </div>
  </main>

  <div class="toast-stack" id="toastStack"></div>

  <script src="scripts/supabase.min.js"></script>
  <script src="scripts/00-supabase.js"></script>
  <script src="scripts/01-auth.js" defer></script>
  <script src="scripts/client-perfil.js" defer></script>
</body>

</html>
